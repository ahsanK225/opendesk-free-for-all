[package]
name = "opendesk-engine"
version = "3.0.0-alpha.1"
edition = "2024"
license = "MIT"
description = "Native OpenDesk engine; protocol and authorization migration"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
panic = "abort"
