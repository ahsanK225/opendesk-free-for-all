[package]
name = "opendesk-launcher"
version = "3.0.0-alpha.1"
edition = "2024"
license = "MIT"

[features]
default = []
portable = ["dep:zip"]
fixtures = []

[dependencies]
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"], optional = true }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[[bin]]
name = "OpenDeskSetupHelper"
path = "src/main.rs"

[[bin]]
name = "OpenDeskPortable"
path = "src/portable.rs"
required-features = ["portable"]

[[bin]]
name = "OpenDeskLauncherProbe"
path = "src/probe.rs"
required-features = ["fixtures"]

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
panic = "abort"
